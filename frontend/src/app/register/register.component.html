<div class="auth-container">
  <div class="auth-card">
    <h2>Registro - TaskFlow</h2>
    
    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" [(ngModel)]="userData.username" name="username" required placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" [(ngModel)]="userData.email" name="email" required placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="userData.password" name="password" required placeholder="********">
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <p class="auth-redirect">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
