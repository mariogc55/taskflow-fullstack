<div class="container mt-5" style="max-width: 700px;">
  <h2 class="text-center mb-4 fw-bold text-primary">TaskFlow - Gestor de Tareas</h2>

  <div class="card shadow-sm p-4 mb-4 border-0 bg-light">
    <h4 class="mb-3 text-secondary">Nueva Tarea</h4>
    <div class="mb-3">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Título de la tarea" 
        [(ngModel)]="newTask.title" 
      />
    </div>
    <div class="mb-3">
      <textarea 
        class="form-control" 
        placeholder="Descripción detallada" 
        rows="2"
        [(ngModel)]="newTask.description" 
      ></textarea>
    </div>
    <button class="btn btn-primary w-100 fw-bold py-2" (click)="addTask()">
      Guardar Tarea
    </button>
  </div>

  <h4 class="mb-3 text-secondary">Lista de Tareas</h4>
  
  @if (tasks.length === 0) {
    <div class="alert alert-info text-center shadow-sm" role="alert">
      No hay tareas creadas todavía. ¡Crea una arriba!
    </div>
  }

  <div class="list-group">
    <div *ngFor="let task of tasks" class="card shadow-sm mb-3 p-3 border-0">
      
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <input 
            type="checkbox" 
            class="form-check-input mt-0" 
            style="transform: scale(1.3); cursor: pointer;"
            [checked]="task.status === 'Completed'" 
            (change)="toggleTaskStatus(task)" 
          />
          
          <span [class.text-decoration-line-through]="task.status === 'Completed'"
                [class.text-muted]="task.status === 'Completed'"
                class="fs-5 fw-semibold">
            {{ task.title }}
          </span>
        </div>
        
        <span class="badge" [ngClass]="task.status === 'Completed' ? 'bg-success' : 'bg-warning text-dark'">
          {{ task.status || 'Pending' }}
        </span>
      </div>

      <p class="text-muted ms-4 mt-2 mb-3" style="font-size: 0.95rem;">
        {{ task.description }}
      </p>

      <div class="ms-4">
        <button class="btn btn-outline-danger btn-sm px-3" (click)="deleteTask(task.id)">
          Eliminar
        </button>
      </div>

    </div>
  </div>
</div>
