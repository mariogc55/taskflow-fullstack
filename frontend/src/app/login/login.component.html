<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión - TaskFlow</h2>
    
    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" [(ngModel)]="credentials.email" name="email" required placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="credentials.password" name="password" required placeholder="********">
      </div>

      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <p class="auth-redirect">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
    </p>
  </div>
</div>
